<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; }
    #player { width: 100%; height: 100%; }
  </style>
  <!-- Clappr Core (incluye soporte nativo para HLS .m3u8) -->
  <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
</head>
<body>

<div id="player"></div>

<script>
  var player = new Clappr.Player({
    source: 'https://rtvelivestream.rtve.es/rtvesec/la2/la2_main_dvr.m3u8',
    parentId: '#player',
    autoPlay: true,
    mute: false,  // Audio activado por defecto
    volume: 100,  // Volumen al 100%
    width: '100%',
    height: '100%'
  });
</script>

</body>
</html>
